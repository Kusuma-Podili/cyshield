title: PsExec Remote Service Lateral Movement Execution
id: d35b0c89-7c8f-1e2b-6b0d-4f5a8c9d0e1f
status: production
description: Detects execution of PsExec service (PSEXESVC) or command line execution across administrative SMB shares (ADMIN$, C$) for lateral movement.
author: CyberShield Threat Labs
level: high
tags:
  - attack.lateral_movement
  - attack.execution
  - attack.t1021.002
logsource:
  category: process_creation
  product: windows
detection:
  selection_binary:
    Image|endswith:
      - 'PsExec.exe'
      - 'PsExec64.exe'
      - 'psexesvc.exe'
  selection_service:
    CommandLine|contains:
      - 'ADMIN$\'
      - 'psexesvc'
      - '-accepteula'
  condition: selection_binary or selection_service
falsepositives:
  - Legitimate IT remote troubleshooting tools
