title: Mimikatz LSASS Password Dumper Execution
id: f4a8c9e1-2b3d-4e5f-6a7b-8c9d0e1f2a3b
status: production
description: Detects process creation or command-line parameters matching Mimikatz credential theft (sekurlsa, logonpasswords, privilege::debug).
author: CyberShield Threat Labs
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'sekurlsa'
      - 'logonpasswords'
      - 'privilege::debug'
      - 'lsadump::sam'
      - 'dpapi::masterkey'
  condition: selection
falsepositives:
  - Authorized penetration testing engagements
